name: KO 1298 Client Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build client
        shell: pwsh
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=Win32 /p:NO_CLIENT_ASSETS=1 Client.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: OpenKO-1298-Client
          path: bin/Release-Win32/*.exe
          if-no-files-found: error
          retention-days: 7